name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Generate DOCX from resume markdown
        run: |
          # Strip YAML frontmatter and convert to DOCX
          sed '1{/^---$/!q;};1,/^---$/d' content/resume.md > /tmp/resume-body.md
          pandoc /tmp/resume-body.md -o public/Denis_Mikhalev_Resume.docx \
            --from markdown --to docx

      - name: Install WeasyPrint
        run: |
          sudo apt-get install -y python3-pip libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2
          pip install weasyprint

      - name: Generate PDF from resume page
        run: |
          weasyprint public/resume/index.html public/Denis_Mikhalev_Resume.pdf \
            --stylesheet public/css/resume-print.css

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4